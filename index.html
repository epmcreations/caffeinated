<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>caffeinated</title>
    <meta name="description" content="Keep your screen awake." />
    <meta name="theme-color" content="#000000" />

    <!-- Apple & PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="caffeinated" />

    <!-- Google Fonts: Montserrat (Bold & Soft) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon using Twitter Coffee Emoji Vector -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/2615.svg"
    />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background-color: #000000;
        color: #ffffff;
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 32px 20px;
        user-select: none;
        -webkit-user-select: none;
      }

      header {
        width: 100%;
        max-width: 440px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand img {
        width: 32px;
        height: 32px;
        object-fit: contain;
      }

      .brand h1 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        text-transform: lowercase;
      }

      .status-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 9999px;
        border: 1.5px solid #1a1a1a;
        background: #0d0d0d;
        font-size: 13px;
        font-weight: 600;
        color: #666666;
        text-transform: lowercase;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #444444;
        transition: background-color 0.3s ease;
      }

      .status-badge.active .status-dot {
        background-color: #22c55e;
        box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
      }

      .status-badge.active {
        color: #ffffff;
        border-color: #333333;
      }

      main {
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 36px;
        margin: auto 0;
      }

      .timer-display {
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -2px;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      .action-controls {
        display: flex;
        gap: 16px;
      }

      .btn-icon {
        background: #111111;
        border: 1.5px solid #222222;
        color: #ffffff;
        width: 60px;
        height: 60px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn-icon:hover {
        background: #1a1a1a;
        border-color: #333333;
      }

      .btn-icon:active {
        transform: scale(0.94);
      }

      .preset-grid {
        display: flex;
        gap: 8px;
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn-preset {
        background: #0d0d0d;
        border: 1.5px solid #1a1a1a;
        color: #777777;
        padding: 12px 20px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 700;
        font-family: 'Montserrat', sans-serif;
        cursor: pointer;
        text-transform: lowercase;
        transition: all 0.2s ease;
      }

      .btn-preset:hover {
        color: #ffffff;
        border-color: #333333;
      }

      .btn-preset.active {
        background: #ffffff;
        color: #000000;
        border-color: #ffffff;
      }

      .custom-container {
        width: 100%;
        display: none;
        gap: 10px;
        justify-content: center;
        align-items: center;
      }

      .custom-container.open {
        display: flex;
      }

      .custom-input {
        background: #0d0d0d;
        border: 1.5px solid #222222;
        color: #ffffff;
        padding: 12px 18px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 700;
        font-family: 'Montserrat', sans-serif;
        width: 130px;
        outline: none;
        text-align: center;
      }

      .custom-input:focus {
        border-color: #444444;
      }

      .btn-set {
        background: #ffffff;
        color: #000000;
        border: none;
        padding: 12px 22px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 800;
        font-family: 'Montserrat', sans-serif;
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      .btn-set:active {
        transform: scale(0.95);
      }

      footer {
        width: 100%;
        max-width: 440px;
        display: flex;
        justify-content: center;
        padding-top: 16px;
      }

      .btn-install {
        background: transparent;
        border: 1.5px dashed #222222;
        color: #666666;
        padding: 10px 20px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 700;
        font-family: 'Montserrat', sans-serif;
        cursor: pointer;
        display: none;
        text-transform: lowercase;
        transition: all 0.2s ease;
      }

      .btn-install:hover {
        color: #ffffff;
        border-color: #444444;
      }

      .btn-install.visible {
        display: block;
      }

      #wakelock-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        opacity: 0.01;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <video id="wakelock-video" playsinline loop muted>
      <source
        src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAAYbWRhdGFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYAAAABx2aWRzY2FsbAAAAAB3aWRzY2FsbAAAAAA="
        type="video/mp4"
      />
    </video>

    <header>
      <div class="brand">
        <img
          id="header-logo"
          src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/2615.svg"
          alt="coffee emoji"
        />
        <h1>caffeinated</h1>
      </div>
      <div class="status-badge" id="status-badge" role="button">
        <div class="status-dot"></div>
        <span id="status-text">paused</span>
      </div>
    </header>

    <main>
      <div class="timer-display" id="timer-display">∞</div>

      <div class="action-controls">
        <button class="btn-icon" id="btn-toggle" aria-label="Toggle Timer">
          <i data-lucide="play"></i>
        </button>
        <button class="btn-icon" id="btn-reset" aria-label="Reset Timer">
          <i data-lucide="rotate-ccw"></i>
        </button>
      </div>

      <div class="preset-grid">
        <button class="btn-preset active" data-mode="infinite">∞</button>
        <button class="btn-preset" data-mode="30m">30m</button>
        <button class="btn-preset" data-mode="1h">1h</button>
        <button class="btn-preset" data-mode="2h">2h</button>
        <button class="btn-preset" data-mode="custom">custom</button>
      </div>

      <div class="custom-container" id="custom-container">
        <input
          type="number"
          id="custom-minutes"
          class="custom-input"
          placeholder="minutes"
          min="1"
          max="1440"
        />
        <button class="btn-set" id="btn-set-custom">set</button>
      </div>
    </main>

    <footer>
      <button class="btn-install" id="btn-install">install app</button>
    </footer>

    <script>
      // State
      let wakeLock = null;
      let mode = 'infinite';
      let totalSeconds = 0;
      let remainingSeconds = 0;
      let isRunning = false;
      let timerInterval = null;
      let endTime = null;

      // Elements
      const statusBadge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      const timerDisplay = document.getElementById('timer-display');
      const btnToggle = document.getElementById('btn-toggle');
      const btnReset = document.getElementById('btn-reset');
      const presetButtons = document.querySelectorAll('.btn-preset');
      const customContainer = document.getElementById('custom-container');
      const customInput = document.getElementById('custom-minutes');
      const btnSetCustom = document.getElementById('btn-set-custom');
      const btnInstall = document.getElementById('btn-install');
      const videoElem = document.getElementById('wakelock-video');

      // Wake Lock Handler
      async function requestWakeLock() {
        if ('wakeLock' in navigator) {
          try {
            wakeLock = await navigator.wakeLock.request('screen');
            setAwakeUI(true);

            wakeLock.addEventListener('release', () => {
              if (isRunning) {
                setAwakeUI(false);
              }
            });
          } catch (err) {
            fallbackWakeLock();
          }
        } else {
          fallbackWakeLock();
        }
      }

      function fallbackWakeLock() {
        if (videoElem) {
          videoElem.play().then(() => setAwakeUI(true)).catch(() => setAwakeUI(false));
        }
      }

      function releaseWakeLock() {
        if (wakeLock) {
          wakeLock.release().catch(() => {});
          wakeLock = null;
        }
        if (videoElem) {
          videoElem.pause();
        }
        setAwakeUI(false);
      }

      function setAwakeUI(active) {
        if (active) {
          statusBadge.classList.add('active');
          statusText.textContent = 'awake';
        } else {
          statusBadge.classList.remove('active');
          statusText.textContent = 'paused';
        }
      }

      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible' && isRunning) {
          await requestWakeLock();
        }
      });

      // Formatting Time
      function formatTime(sec) {
        if (mode === 'infinite') return '∞';
        const hrs = Math.floor(sec / 3600);
        const mins = Math.floor((sec % 3600) / 60);
        const secs = sec % 60;

        const pad = (n) => String(n).padStart(2, '0');
        if (hrs > 0) {
          return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
        }
        return `${pad(mins)}:${pad(secs)}`;
      }

      // Update Display & Controls
      function updateDisplay() {
        timerDisplay.textContent = formatTime(remainingSeconds);
        if (mode !== 'infinite' && isRunning) {
          document.title = `${formatTime(remainingSeconds)} - caffeinated`;
        } else {
          document.title = 'caffeinated';
        }
      }

      function updateControls() {
        btnToggle.innerHTML = isRunning ? '<i data-lucide="pause"></i>' : '<i data-lucide="play"></i>';
        lucide.createIcons();
      }

      // Timer Logic
      function startTimer() {
        isRunning = true;
        requestWakeLock();
        updateControls();

        if (mode !== 'infinite') {
          if (!endTime || remainingSeconds <= 0) {
            endTime = Date.now() + remainingSeconds * 1000;
          }
          clearInterval(timerInterval);

          timerInterval = setInterval(() => {
            const secondsLeft = Math.max(0, Math.round((endTime - Date.now()) / 1000));
            remainingSeconds = secondsLeft;
            updateDisplay();

            if (remainingSeconds <= 0) {
              pauseTimer();
            }
          }, 200);
        }
      }

      function pauseTimer() {
        isRunning = false;
        clearInterval(timerInterval);
        releaseWakeLock();
        updateControls();
      }

      // Event Listeners
      btnToggle.addEventListener('click', () => {
        if (isRunning) {
          pauseTimer();
        } else {
          startTimer();
        }
      });

      statusBadge.addEventListener('click', () => {
        if (isRunning) {
          pauseTimer();
        } else {
          startTimer();
        }
      });

      btnReset.addEventListener('click', () => {
        pauseTimer();
        remainingSeconds = totalSeconds;
        endTime = totalSeconds > 0 ? Date.now() + totalSeconds * 1000 : null;
        updateDisplay();
      });

      // Preset Buttons
      presetButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          presetButtons.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');

          const selectedMode = btn.dataset.mode;
          mode = selectedMode;
          customContainer.classList.remove('open');

          if (selectedMode === 'infinite') {
            totalSeconds = 0;
            remainingSeconds = 0;
            endTime = null;
          } else if (selectedMode === '30m') {
            totalSeconds = 30 * 60;
            remainingSeconds = totalSeconds;
            endTime = Date.now() + totalSeconds * 1000;
          } else if (selectedMode === '1h') {
            totalSeconds = 60 * 60;
            remainingSeconds = totalSeconds;
            endTime = Date.now() + totalSeconds * 1000;
          } else if (selectedMode === '2h') {
            totalSeconds = 120 * 60;
            remainingSeconds = totalSeconds;
            endTime = Date.now() + totalSeconds * 1000;
          } else if (selectedMode === 'custom') {
            customContainer.classList.add('open');
            pauseTimer();
            return;
          }

          updateDisplay();
          startTimer();
        });
      });

      // Custom Input Set Button
      btnSetCustom.addEventListener('click', () => {
        const val = parseInt(customInput.value, 10);
        if (val && val > 0) {
          totalSeconds = val * 60;
          remainingSeconds = totalSeconds;
          endTime = Date.now() + totalSeconds * 1000;
          updateDisplay();
          startTimer();
        }
      });

      // PWA Prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        btnInstall.classList.add('visible');
      });

      btnInstall.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            btnInstall.classList.remove('visible');
          }
          deferredPrompt = null;
        }
      });

      // Initialize Icons & Auto-start Infinite Mode on Load
      lucide.createIcons();
      updateDisplay();
      startTimer();
    </script>
  </body>
</html>
