<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>caffeinated</title>
  <meta name="description" content="Keep your screen awake." />
  <meta name="theme-color" content="#000000" />

  <!-- Apple & PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="caffeinated" />

  <!-- Web App Manifest -->
  <link rel="manifest" id="manifest-link" />

  <!-- Google Fonts: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Favicon using Twitter Coffee Emoji Vector -->
  <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/2615.svg" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(16px, 4vh, 48px);
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    /* Responsive, One-Size-Fits-All Container */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: clamp(16px, 3vh, 32px);
      width: 100%;
      max-width: 420px;
      margin: auto;
    }

    /* Interactive Coffee Emoji Wrapper */
    .coffee-wrapper {
      position: relative;
      cursor: pointer;
      padding: 12px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .coffee-icon {
      width: clamp(80px, 20vw, 120px);
      height: clamp(80px, 20vw, 120px);
      object-fit: contain;
      /* Smooth cubic-bezier spring for satisfying deflate/inflate */
      transition: filter 0.3s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Paused State (Grayscale) */
    .coffee-wrapper.paused .coffee-icon {
      filter: grayscale(100%) opacity(0.35);
    }

    /* Active State (Full color, no glow) */
    .coffee-wrapper.active .coffee-icon {
      filter: grayscale(0%) opacity(1);
    }

    /* Smooth Deflate / Inflate Click Animation */
    .coffee-wrapper.pop .coffee-icon {
      transform: scale(0.8);
      transition: transform 0.12s ease-in;
    }

    /* Status Text */
    .status-title {
      font-size: clamp(14px, 3.5vw, 18px);
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #666666; /* Matching faint text color for both states */
      line-height: 1.4;
      text-transform: lowercase;
      white-space: nowrap;
    }

    /* Timer Display */
    .timer-display {
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #444444;
      white-space: nowrap;
      letter-spacing: -0.5px;
      transition: color 0.3s ease;
    }

    /* Active Timer turns vibrant green */
    .coffee-wrapper.active ~ .timer-display {
      color: #22c55e;
    }

    /* Subtle Install Button at base */
    .btn-install {
      position: absolute;
      bottom: clamp(16px, 3vh, 32px);
      background: transparent;
      border: 1px dashed #222222;
      color: #555555;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      display: none;
      text-transform: lowercase;
      transition: all 0.2s ease;
    }

    .btn-install:hover {
      color: #aaaaaa;
      border-color: #444444;
    }

    .btn-install.visible {
      display: block;
    }

    #wakelock-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <video id="wakelock-video" playsinline loop muted>
    <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAAYbWRhdGFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYAAAABx2aWRzY2FsbAAAAAB3aWRzY2FsbAAAAAA=" type="video/mp4" />
  </video>

  <div class="container">
    <div class="coffee-wrapper paused" id="coffee-toggle" role="button" aria-label="Toggle Wake Lock">
      <img id="coffee-icon" class="coffee-icon" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/2615.svg" alt="coffee emoji" />
    </div>

    <p class="status-title" id="status-title">caffeinated paused.</p>

    <div class="timer-display" id="timer-display">00 : 00</div>
  </div>

  <button class="btn-install" id="btn-install">install app</button>

  <script>
    // Manifest Setup with High Quality Vector Icon for PWA
    const manifestData = {
      name: "Caffeinated",
      short_name: "caffeinated",
      start_url: "./",
      display: "standalone",
      background_color: "#000000",
      theme_color: "#000000",
      icons: [{
        src: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/2615.svg",
        sizes: "192x192 512x512",
        type: "image/svg+xml",
        purpose: "any maskable"
      }]
    };
    try {
      const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
      document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);
    } catch (e) {}

    // Service Worker Setup
    if ('serviceWorker' in navigator) {
      try {
        const swScript = "self.addEventListener('install', function(e) { e.waitUntil(self.skipWaiting()); }); self.addEventListener('activate', function(e) { e.waitUntil(self.clients.claim()); });";
        const swBlob = new Blob([swScript], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(function() {});
      } catch (e) {}
    }

    // App State
    let wakeLock = null;
    let isRunning = false;
    let elapsedSeconds = 0;
    let timerInterval = null;
    let startTime = null;

    // Elements
    const coffeeToggle = document.getElementById('coffee-toggle');
    const statusTitle = document.getElementById('status-title');
    const timerDisplay = document.getElementById('timer-display');
    const btnInstall = document.getElementById('btn-install');
    const videoElem = document.getElementById('wakelock-video');

    // Wake Lock Handler
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          setUIState(true);

          wakeLock.addEventListener('release', function() {
            if (isRunning) {
              setUIState(false);
            }
          });
          return;
        } catch (err) {}
      }
      fallbackWakeLock();
    }

    function fallbackWakeLock() {
      if (videoElem) {
        videoElem.play().then(function() {
          setUIState(true);
        }).catch(function() {
          setUIState(false);
        });
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(function() {});
        wakeLock = null;
      }
      if (videoElem) {
        videoElem.pause();
      }
      setUIState(false);
    }

    function setUIState(active) {
      if (active) {
        coffeeToggle.classList.remove('paused');
        coffeeToggle.classList.add('active');
        statusTitle.textContent = 'keeping your device awake.';
      } else {
        coffeeToggle.classList.remove('active');
        coffeeToggle.classList.add('paused');
        statusTitle.textContent = 'caffeinated paused.';
      }
    }

    // Auto Resume on Tab Focus
    document.addEventListener('visibilitychange', async function() {
      if (document.visibilityState === 'visible' && isRunning) {
        await requestWakeLock();
      }
    });

    // Format Count-Up Time
    function formatTime(sec) {
      const hrs = Math.floor(sec / 3600);
      const mins = Math.floor((sec % 3600) / 60);
      const secs = sec % 60;

      const pad = function(n) { return String(n).padStart(2, '0'); };
      if (hrs > 0) {
        return hrs + ' : ' + pad(mins) + ' : ' + pad(secs);
      }
      return pad(mins) + ' : ' + pad(secs);
    }

    function updateDisplay() {
      timerDisplay.textContent = formatTime(elapsedSeconds);
      if (isRunning) {
        document.title = formatTime(elapsedSeconds) + ' - caffeinated';
      } else {
        document.title = 'caffeinated';
      }
    }

    // Timer Logic
    function startCaffeinated() {
      isRunning = true;
      requestWakeLock();
      startTime = Date.now() - (elapsedSeconds * 1000);

      clearInterval(timerInterval);
      timerInterval = setInterval(function() {
        elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        updateDisplay();
      }, 500);
    }

    function pauseCaffeinated() {
      isRunning = false;
      clearInterval(timerInterval);
      releaseWakeLock();
      updateDisplay();
    }

    // Toggle Click Event with Satisfying Deflate/Inflate Animation
    coffeeToggle.addEventListener('click', function() {
      coffeeToggle.classList.add('pop');
      setTimeout(function() {
        coffeeToggle.classList.remove('pop');
      }, 120);

      if (isRunning) {
        pauseCaffeinated();
      } else {
        startCaffeinated();
      }
    });

    // PWA Prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.classList.add('visible');
    });

    btnInstall.addEventListener('click', async function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const outcome = (await deferredPrompt.userChoice).outcome;
        if (outcome === 'accepted') {
          btnInstall.classList.remove('visible');
        }
        deferredPrompt = null;
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', function() {
      updateDisplay();
    });
  </script>
</body>

</html>
